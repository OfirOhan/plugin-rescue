name: plugin-test
on:
  workflow_dispatch:
    inputs:
      slug: {description: "wordpress.org plugin slug", required: true}
      version: {description: "plugin version (blank = latest)", required: false, default: ""}
      apply_fix: {description: "apply fixes/<slug>.py before testing", required: false, default: "false"}
      wp: {description: "WordPress version", required: false, default: "latest"}
run-name: "${{ inputs.slug }} ${{ inputs.version }} fix=${{ inputs.apply_fix }} wp=${{ inputs.wp }}"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {php: ["8.3", "8.4"]}
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: wp}
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: "${{ matrix.php }}", extensions: "mysqli, curl, mbstring", tools: wp-cli}
      - name: Install WordPress
        run: |
          mkdir site && cd site
          wp core download --version="${{ inputs.wp }}"
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp config set WP_DEBUG true --raw && wp config set WP_DEBUG_LOG true --raw && wp config set WP_DEBUG_DISPLAY false --raw
          wp core install --url=http://127.0.0.1:8080 --title=t --admin_user=admin --admin_password=admin --admin_email=a@example.com --skip-email
          echo "WordPress $(wp core version), PHP $(php -r 'echo PHP_VERSION;')"
      - name: Install plugin
        working-directory: site
        run: |
          V="${{ inputs.version }}"; if [ -n "$V" ]; then wp plugin install "${{ inputs.slug }}" --version="$V"; else wp plugin install "${{ inputs.slug }}"; fi
          wp plugin list --name="${{ inputs.slug }}"
      - name: Apply fix
        if: inputs.apply_fix == 'true'
        run: |
          cp -r site/wp-content/plugins/${{ inputs.slug }} /tmp/orig
          python3 fixes/${{ inputs.slug }}.py site/wp-content/plugins/${{ inputs.slug }}
          for f in $(cd /tmp/orig && find . -name '*.php'); do php -l "site/wp-content/plugins/${{ inputs.slug }}/$f" >/dev/null || exit 1; done
          echo "---- diff ----"; diff -ru /tmp/orig site/wp-content/plugins/${{ inputs.slug }} || true
      - name: Activate and smoke test
        working-directory: site
        run: |
          rm -f wp-content/debug.log
          wp plugin activate "${{ inputs.slug }}"
          php -S 127.0.0.1:8080 >/dev/null 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "front %{http_code}\n" http://127.0.0.1:8080/
          wp eval 'wp_set_current_user(1); set_current_screen("dashboard"); do_action("admin_init"); do_action("admin_menu"); do_action("admin_notices"); echo "admin hooks ok\n";'
      - name: Targeted reproduction
        working-directory: site
        run: |
          if [ -f ../repro/${{ inputs.slug }}.php ]; then wp eval-file ../repro/${{ inputs.slug }}.php; else echo "no repro script"; fi
      - name: Fail on PHP errors, warnings, deprecations
        if: always()
        working-directory: site
        run: |
          touch wp-content/debug.log
          echo "---- debug.log ----"; cat wp-content/debug.log
          if grep -E "PHP (Fatal|Warning|Deprecated|Notice)|Uncaught" wp-content/debug.log | grep -F "plugins/${{ inputs.slug }}/"; then echo "RESULT: FAIL"; exit 1; fi
          echo "RESULT: PASS (no PHP errors from plugins/${{ inputs.slug }}/)"
